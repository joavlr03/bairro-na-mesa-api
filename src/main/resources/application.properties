spring.application.name=bairro-na-mesa-api
server.port=${PORT:8080}

# SQL Server: credenciais sempre por variavel de ambiente, nunca no repositorio
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=bairronamesa;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Nao expor detalhes internos nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never

# Atras do proxy HTTPS do Azure: sem isto o Swagger gera URLs http e o "Try it out" falha
server.forward-headers-strategy=framework

# A rota "/" redireciona para o Swagger UI
springdoc.swagger-ui.use-root-path=true
